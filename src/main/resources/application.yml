spring:
  application:
    name: bgroceries-backend
  # prod = Neon PostgreSQL (the real database). dev = H2 in-memory, zero setup.
  profiles:
    active: prod
  # Outbound HTTP (used by the social login verifiers to reach Google/Facebook).
  http:
    client:
      connect-timeout: 5s
      read-timeout: 5s
  # Email (forgot-password OTP delivery). Gmail SMTP works locally; set
  # GMAIL_SMTP_USERNAME / GMAIL_SMTP_PASSWORD (an App Password) to actually send.
  # Empty defaults -> SmtpEmailServiceImpl falls back to the console log.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SMTP_USERNAME:b.groceriesdev@gmail.com}
    password: ${GMAIL_SMTP_PASSWORD:doemwmgxjzazndap}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Spring Security OAuth2 Client (for server-side OAuth2 flow)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 457341066065-0ja001e981hnhhe92uffiu7cbqpg6q1v.apps.googleusercontent.com
            client-secret: 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
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${FACEBOOK_APP_ID:1352113810463033}
            client-secret: ${FACEBOOK_APP_SECRET:e64907e71514d2f8b2f5af4b3c060eda}
            scope: email,public_profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v21.0/dialog/oauth
            token-uri: https://graph.facebook.com/v21.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture

server:
  port: 8081

app:
  jwt:
    # CHANGE THIS SECRET before deploying to production (min 32 chars).
    secret: ${JWT_SECRET:bgroceries-super-secret-key-change-this-in-production-min-32-chars}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}   # 24 hours
    reset-token-expiration-ms: ${JWT_RESET_EXPIRATION_MS:600000}       # 10 minutes
  otp:
    length: 6
    expiry-minutes: 2
    max-attempts: 2
    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:false}
  # OAuth2 redirect URI — where to send the user after successful social login with JWT token
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  social:
    # Real OAuth credentials. Placeholders below mean "not configured" -> social login
    # with a token fails with 401 until real values are supplied via env vars.
    google:
      client-id: 457341066065-0ja001e981hnhhe92uffiu7cbqpg6q1v.apps.googleusercontent.com
    facebook:
      app-id: ${FACEBOOK_APP_ID:1352113810463033}
      app-secret: ${FACEBOOK_APP_SECRET:e64907e71514d2f8b2f5af4b3c060eda}
      graph-version: ${FACEBOOK_GRAPH_VERSION:v21.0}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:8953064860:AAECU4pZPZaOMZ2SInNSotSNbZA9V8M-KWU}
  telegram:
    bot:
      token: ${TELEGRAM_BOT_TOKEN:8953064860:AAECU4pZPZaOMZ2SInNSotSNbZA9V8M-KWU}
      username: ${TELEGRAM_BOT_USERNAME:B'GroceriesBot}
    webhook:
      secret: ${TELEGRAM_WEBHOOK_SECRET:https://shaggy-socks-shout.loca.lt}
