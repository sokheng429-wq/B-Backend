spring:
  datasource:
    url: jdbc:h2:mem:bgroceries
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  otp:
    # OTP code is echoed back in the API response so you can test the full
    # Register / Login / OTP / Forgot-password flow without a real SMS gateway.
    # Turn this OFF (false) once a real SmsService is wired up.
    expose-in-response: true
